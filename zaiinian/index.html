<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地狗·灾厄年</title>
<style>
  :root{
    --bg:#0b1013; --panel:#121a1e; --panel2:#182329; --line:#2a3a42;
    --gold:#d9b26a; --golddim:#8f7640;
    --spring:#e6a3bd; --summer:#7fbf7a; --autumn:#dda447; --winter:#7faed6;
    --beast:#c4483c;
    --text:#ece4d4; --muted:#94a0a5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
  body{
    background:
      radial-gradient(90% 60% at 50% -10%, #17242a 0%, rgba(11,16,19,0) 62%),
      repeating-linear-gradient(90deg, rgba(217,178,106,.035) 0 1px, transparent 1px 24px),
      #0b1013;
    color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px;line-height:1.55;min-height:100vh;
  }
  #app{max-width:820px;margin:0 auto;padding:0 12px 130px}

  /* 顶栏 */
  header.top{
    position:sticky;top:0;z-index:6;margin:0 -12px 8px;padding:8px 12px 8px;
    background:rgba(9,13,16,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .hdr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ttl{font-size:16px;font-weight:800;letter-spacing:3px;color:var(--gold);font-family:"Songti SC","SimSun",serif}
  .ttl small{font-size:11px;letter-spacing:0;color:var(--muted);font-weight:400;margin-left:6px}
  .hdr-r{margin-left:auto;display:flex;gap:6px}
  .icobtn{
    min-height:40px;padding:0 11px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit;
  }
  .icobtn:active{background:#203038}

  /* 信息条 */
  .bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .chip{
    flex:1 1 0;min-width:62px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);padding:4px 7px;text-align:center;line-height:1.25;
  }
  .chip span{display:block;font-size:10px;color:var(--muted);letter-spacing:1px}
  .chip b{font-size:15px;color:var(--text)}
  .chip.hot b{color:var(--beast)}

  /* 年兽 */
  .beast{
    position:relative;border:1px solid #4a2b26;border-radius:14px;margin-bottom:10px;
    background:linear-gradient(180deg,#201312,#150d0c 65%,#120b0a);
    box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 0 40px rgba(196,72,60,.10);
    padding:9px 10px 10px;overflow:hidden;
  }
  .beast.rage{border-color:#7a3328;box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 0 46px rgba(196,72,60,.26)}
  .beast::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 9px);
  }
  .bs-top{display:flex;align-items:center;gap:8px}
  .mask{width:34px;height:42px;flex:0 0 auto}
  .bs-name{font-family:"Songti SC","SimSun",serif;font-size:16px;letter-spacing:2px;color:#e7c9a5}
  .bs-sub{font-size:11px;color:#b08a7a}
  .bs-right{margin-left:auto;text-align:right}
  .bs-hp{font-size:12px;color:#e0b6a8}
  .bs-hp b{font-size:16px;color:#ff8f7a}
  .lamps{display:flex;gap:5px;margin:8px 0 6px}
  .lamp{
    flex:1 1 0;height:9px;border-radius:5px;background:#2a1a18;border:1px solid #4a2b26;
    overflow:hidden;position:relative;
  }
  .lamp i{display:block;height:100%;width:0;transition:width .45s ease;background:linear-gradient(90deg,#c4483c,#f0a35c)}
  .lamps.three{height:14px}
  .lamps.three .lamp{height:14px}
  .next-e{
    display:flex;align-items:center;gap:7px;font-size:11.5px;color:#c8a99c;
    border-top:1px dashed #482c27;padding-top:7px;margin-top:2px;line-height:1.4;
  }
  .next-e .nm{color:#ffb99f;font-weight:700;letter-spacing:1px}
  .next-e .tag{font-size:10px;border:1px solid #6b3a30;border-radius:4px;padding:0 4px;color:#d8a08c}
  .next-e .arrow{margin-left:auto;color:#7d5b52;font-size:10px}

  /* 四房 */
  .rooms{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
  .room{
    position:relative;border:1px solid var(--c-line);border-radius:11px;background:var(--c-bg);
    padding:7px 8px 8px;overflow:hidden;
  }
  .room .glass{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(120deg,rgba(255,255,255,.10) 0,rgba(255,255,255,0) 42%) ;
  }
  .rm-top{display:flex;align-items:center;gap:5px}
  .rm-seal{width:18px;height:18px;flex:0 0 auto;border-radius:4px;background:var(--c);opacity:.85}
  .rm-name{font-family:"Songti SC","SimSun",serif;font-size:14px;letter-spacing:2px;color:var(--c)}
  .rm-who{margin-left:auto;font-size:10px;color:var(--muted)}
  .rm-who.you{color:var(--gold)}
  .hpbar{height:6px;border-radius:3px;background:#22303a;margin:5px 0 4px;overflow:hidden}
  .hpbar i{display:block;height:100%;width:100%;background:var(--c);transition:width .4s ease}
  .rm-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
  .rm-meta b{color:var(--text);font-size:11.5px}
  .room.acting{box-shadow:0 0 0 1px var(--c), 0 0 16px -3px var(--c)}
  .room.down{filter:grayscale(.7);opacity:.62}
  .room.down .rm-name::after{content:"　倒下";font-size:10px;color:#c08a8a;letter-spacing:0}
  .tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;min-height:15px}
  .tag{font-size:10px;border:1px solid var(--c-line);border-radius:4px;padding:0 4px;color:var(--c);background:rgba(255,255,255,.04)}
  .tag.gold{border-color:var(--golddim);color:var(--gold)}
  @media (min-width:640px){ .rooms{grid-template-columns:repeat(4,1fr)} }

  /* 手牌 */
  .handsec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 9px 10px}
  .hand-hd{display:flex;align-items:center;gap:7px;margin-bottom:7px}
  .hand-hd h3{margin:0;font-size:12px;font-weight:500;letter-spacing:1px;color:var(--muted)}
  .hand-hd .who{font-size:11px;color:var(--gold)}
  .hand-hd .cnt{margin-left:auto;font-size:10.5px;color:var(--muted)}
  .cards{display:flex;gap:6px}
  .card{
    flex:1 1 0;min-width:0;min-height:112px;border-radius:9px;padding:6px 5px 5px;
    background:linear-gradient(165deg,#f6efe0,#e3d5b8);color:#2b2418;position:relative;
    border:1px solid #c9b88f;cursor:pointer;display:flex;flex-direction:column;
    box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.4);
    transition:transform .12s,box-shadow .12s;overflow:hidden;
  }
  .card:active{transform:translateY(1px)}
  .card.sel{box-shadow:0 0 0 2px var(--gold),0 6px 16px rgba(217,178,106,.35);transform:translateY(-3px)}
  .card.idle{cursor:default;opacity:.55}
  .card .band{position:absolute;left:0;right:0;top:0;height:3px;background:var(--c,var(--gold))}
  .card .cn{font-family:"Songti SC","SimSun",serif;font-size:14px;font-weight:700;letter-spacing:1px;text-align:center;line-height:1.2;margin-top:3px}
  .card .cm{font-size:10px;line-height:1.25;color:#5b4f38;text-align:center;margin-top:3px;flex:1}
  .card .cf{font-size:9.5px;color:#8a3a2e;text-align:center;line-height:1.2;margin-top:2px}
  .card .cs{font-size:9px;text-align:center;color:#7a6a45;letter-spacing:1px}
  .card.warn .cf{color:#a33228;font-weight:700}
  .card.enter{animation:dealIn .3s ease both}
  @keyframes dealIn{from{opacity:0;transform:translateY(-10px) scale(.94)}to{opacity:1;transform:none}}
  .empty-hand{
    border:1px dashed var(--line);border-radius:9px;min-height:112px;display:flex;
    align-items:center;justify-content:center;color:var(--muted);font-size:12px;flex:1 1 0;
  }

  /* 日志 */
  .logbox{margin-top:9px;border:1px solid var(--line);border-radius:11px;background:#0e1518;overflow:hidden}
  .logbox h3{margin:0;padding:6px 11px;font-size:11px;font-weight:500;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
  .logbox h3 .bx{margin-left:auto;font-size:10px;color:var(--muted)}
  #log{max-height:168px;overflow-y:auto;padding:5px 10px 7px;font-size:11.5px;line-height:1.6}
  .li{padding:1px 0;color:#c3ccc9;word-break:break-word}
  .li .rd{color:var(--golddim);font-size:10px;margin-right:5px}
  .li.big{color:#ffcfa8}
  .li.warn{color:#ff9d86}
  .li.good{color:#9fd79a}
  .li.sys{color:#7c8a90}

  /* 操作栏 */
  .actionbar{
    position:fixed;left:0;right:0;bottom:0;z-index:8;
    background:linear-gradient(180deg,rgba(9,13,16,.72),rgba(9,13,16,.99) 40%);
    border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  }
  .ab-in{max-width:820px;margin:0 auto}
  .ab-tip{font-size:11px;color:var(--muted);margin-bottom:6px;min-height:15px;line-height:1.35}
  .ab-tip b{color:var(--gold)}
  .btns{display:flex;gap:6px}
  .btn{
    flex:1 1 0;min-height:42px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:13.5px;font-weight:600;
    font-family:inherit;cursor:pointer;line-height:1.25;padding:4px 6px;
  }
  .btn:active{background:#203038}
  .btn:disabled{opacity:.34;cursor:not-allowed}
  .btn.atk{background:linear-gradient(180deg,#b23c30,#8a2b22);border-color:#d2685a;color:#ffe6dc}
  .btn.def{background:linear-gradient(180deg,#2b6f86,#1d4c5c);border-color:#4e93a8;color:#dcf2f8}
  .btn.feed{background:linear-gradient(180deg,#7b6330,#5b4820);border-color:#b09353;color:#f8ecd0}
  .btn.gold{background:linear-gradient(180deg,#d9b26a,#a9853f);border:0;color:#241c09;font-weight:800}
  .btn.wide{flex:1 1 100%}

  /* 弹层 */
  .ov{position:fixed;inset:0;z-index:20;display:none;background:rgba(6,9,11,.97);padding:14px;overflow-y:auto}
  .ov.show{display:block}
  .ov.mid{align-items:center;justify-content:center}
  .ov.show.mid{display:flex}
  .sheet{
    width:100%;max-width:540px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:16px 14px;box-shadow:0 24px 60px rgba(0,0,0,.6);
  }
  .sheet h2{margin:0 0 3px;font-size:18px;letter-spacing:2px;color:var(--gold);font-family:"Songti SC","SimSun",serif}
  .xclose{
    position:sticky;top:0;float:right;width:40px;height:40px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel2);color:var(--muted);
    font-size:18px;line-height:1;cursor:pointer;font-family:inherit;
  }
  .tbl{table-layout:fixed}
  .tbl td{word-break:break-all}
  .tbl.small{font-size:10.5px}
  .tbl.small th,.tbl.small td{padding:3px 4px}
  .tbl td i{display:block;font-style:normal;font-size:9.5px;opacity:.9;line-height:1.2}
  .sheet h3{margin:13px 0 5px;font-size:12.5px;color:var(--text);letter-spacing:.5px;border-left:3px solid var(--golddim);padding-left:7px}
  .sheet p,.sheet li{font-size:12.5px;line-height:1.65;color:#cfd8d5;margin:4px 0}
  .sheet ul{padding-left:16px;margin:4px 0}
  .sheet .note{font-size:11px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;margin:8px 0}
  .tbl{width:100%;border-collapse:collapse;font-size:11.5px;margin:5px 0}
  .tbl th,.tbl td{border:1px solid var(--line);padding:3px 5px;text-align:left;line-height:1.45}
  .tbl th{background:#1b262c;color:var(--muted);font-weight:500}
  .tbl td b{color:var(--gold)}
  .scrollx{overflow-x:auto}
  .sw{display:inline-block;min-width:36px}
  .pillrow{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
  .pill{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--muted)}
  .pill b{color:var(--gold)}
  .kbd{font-size:11px;color:var(--muted)}
  .ended .actionbar{display:none}

  /* 选季节 */
  .seasonpick{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
  .sbtn{
    text-align:left;border:1px solid var(--line);border-radius:10px;background:#151f24;
    padding:8px 9px;cursor:pointer;font-family:inherit;color:var(--text);min-height:64px;
    border-left:3px solid var(--c);display:flex;flex-direction:column;gap:1px;
  }
  .sbtn b{font-family:"Songti SC","SimSun",serif;font-size:16px;color:var(--c);letter-spacing:2px}
  .sbtn span{font-size:10.5px;color:var(--muted);letter-spacing:1px}
  .sbtn i{font-size:10.5px;font-style:normal;color:#a9b3b7;line-height:1.4}
  .sbtn.on{background:#22303a;box-shadow:0 0 0 1px var(--c)}

  /* 结算 */
  .hero{font-family:"Songti SC","SimSun",serif;font-size:25px;font-weight:800;letter-spacing:6px;
    text-align:center;margin:4px 0 2px}
  .hero.win{color:var(--gold);text-shadow:0 0 18px rgba(217,178,106,.35)}
  .hero.lose{color:#c4483c}
  .resbox{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:11px 0 8px}
  .resbox div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .resbox span{display:block;font-size:10.5px;color:var(--muted)}
  .resbox b{font-size:15px}
  .erows{display:flex;flex-direction:column;gap:4px;margin:6px 0}
  .erow{display:flex;align-items:center;gap:8px;font-size:12px;background:#141e23;
    border:1px solid var(--line);border-left:3px solid var(--c);border-radius:7px;padding:5px 9px}
  .erow b{color:var(--c);font-family:"Songti SC","SimSun",serif;letter-spacing:1px}
  .erow span{margin-left:auto;color:var(--text)}
  .erow i{font-style:normal;font-size:10px;color:var(--muted);min-width:22px;text-align:right}

  /* ===== 演出层 v2 ===== */
  .icobtn.on{background:#332a18;border-color:var(--golddim);color:var(--gold)}
  .stagewrap{padding:7px 0 2px}
  .stage{display:flex;gap:4px}
  .stage .st{
    flex:1 1 0;display:flex;align-items:center;gap:3px;font-size:10px;color:#7e8c92;
    background:#111a1e;border:1px solid #24333a;border-radius:7px;padding:3px 3px;line-height:1.2;
    transition:.25s;overflow:hidden;white-space:nowrap;
  }
  .stage .st i{
    width:13px;height:13px;border-radius:50%;border:1px solid #3a4a52;font-style:normal;
    font-size:9px;display:flex;align-items:center;justify-content:center;color:#8fa0a6;flex:0 0 auto;
  }
  .stage .st.on{color:var(--gold);border-color:var(--golddim);background:#1e231b}
  .stage .st.on i{background:var(--gold);color:#241c09;border-color:var(--gold)}
  .stage .st.done i{background:#25382d;border-color:#3f5b48;color:#9fd79a}
  .seq{display:flex;gap:4px;margin-top:5px}
  .sq{
    flex:1 1 0;text-align:center;font-size:11.5px;border:1px solid #24333a;border-radius:6px;
    background:#0f171b;color:var(--muted);padding:2px 2px 1px;line-height:1.2;transition:.2s;
    font-family:"Songti SC","SimSun",serif;
  }
  .sq i{display:block;font-style:normal;font-size:9px;color:#7c8a90;font-family:system-ui,sans-serif}
  .sq.you{color:var(--gold);border-color:var(--golddim)}
  .sq.on{background:#22303a;box-shadow:0 0 0 1px var(--c);color:var(--c)}
  .sq.done{color:#5f7068;border-color:#2c3d34}
  .sq.down{opacity:.45;text-decoration:line-through}
  .bs-foot{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:10.5px;min-height:15px}
  .combo{border:1px solid #553a30;border-radius:5px;padding:0 5px;color:#c9a08c;background:rgba(196,72,60,.08);line-height:1.35}
  .combo.hot{color:#ffd0b8;border-color:#a34a3a;background:rgba(196,72,60,.26)}
  .omen{margin-left:auto;color:#e4a06a;font-size:10.5px;text-align:right;line-height:1.3}
  .omen:empty{display:none}
  .omen.flash{animation:omenPulse 1.3s ease 2}
  @keyframes omenPulse{0%,100%{opacity:.75}50%{opacity:1;color:#ffcf9a}}

  .lamp{overflow:visible}
  .lamp u{
    position:absolute;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;
    background:radial-gradient(circle,#ffe2a6,#e08a3c 62%,rgba(224,138,60,0));
    box-shadow:0 0 9px #e08a3c;transform:translateX(-50%);transition:left .45s ease;pointer-events:none;
  }
  .lamp.out{opacity:.6;filter:saturate(.25)}
  .lamp.out i{background:#3a2622}
  .lamp.out u{display:none}
  .lamp.dying u{animation:flick .95s infinite}
  .lamp.dying i{background:linear-gradient(90deg,#8d2f26,#e08a3c)}
  @keyframes flick{0%,100%{opacity:.55;transform:translateX(-50%) scale(.9)}45%{opacity:1;transform:translateX(-50%) scale(1.28)}}

  .beast.hit{box-shadow:0 0 0 1px #ff8f7a,0 0 26px rgba(196,72,60,.55),inset 0 0 40px rgba(196,72,60,.22)}
  .beast.shake,.room.shake{animation:bshake .42s}
  @keyframes bshake{0%,100%{transform:translate(0,0)}18%{transform:translate(-4px,2px)}38%{transform:translate(5px,-2px)}58%{transform:translate(-3px,-1px)}78%{transform:translate(3px,1px)}}

  #fx{position:fixed;inset:0;pointer-events:none;z-index:18;overflow:hidden}
  .fnum{
    position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:17px;letter-spacing:.5px;
    text-shadow:0 2px 6px rgba(0,0,0,.75);animation:fnum 1.05s ease-out forwards;
    font-family:"Songti SC","SimSun",serif;white-space:nowrap;
  }
  .fnum.dmg{color:#ff8f7a}
  .fnum.heal{color:#9fd79a}
  .fnum.shield{color:#7fc6dd;font-size:14px}
  .fnum.amp{color:#ffd08a;font-size:14px}
  .fnum.down{color:#ff6f5e;font-size:15px}
  .fnum.lamp{color:#ffc16a;font-size:13.5px}
  @keyframes fnum{0%{opacity:0;transform:translate(-50%,-30%) scale(.85)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-165%) scale(1.05)}}

  .cine{
    position:fixed;inset:0;z-index:28;display:none;align-items:center;justify-content:center;
    background:rgba(4,7,9,.55);
  }
  .cine.show{display:flex}
  .cine-in{
    text-align:center;padding:15px 20px 13px;min-width:66vw;max-width:88vw;
    border-top:1px solid rgba(217,178,106,.62);border-bottom:1px solid rgba(217,178,106,.62);
    background:rgba(7,11,13,.97);animation:cineIn .45s ease both;
    box-shadow:0 0 30px rgba(0,0,0,.5);backdrop-filter:blur(2px);
  }
  .cine b{
    display:block;font-family:"Songti SC","SimSun",serif;font-size:32px;letter-spacing:10px;
    color:var(--gold);text-shadow:0 0 26px rgba(217,178,106,.5);line-height:1.25;white-space:nowrap;
  }
  .cine span{display:block;margin-top:5px;font-size:12px;color:#cfd8d5;letter-spacing:1px}
  .cine u{display:block;margin-top:8px;font-size:9.5px;color:#7e8c92;letter-spacing:2px;text-decoration:none}
  .cine.rage b{color:#ff9d6e;text-shadow:0 0 28px rgba(196,72,60,.65);animation:flickTxt 1.1s infinite}
  .cine.fury b{color:#ff6b58;text-shadow:0 0 30px rgba(255,80,60,.7);font-size:36px}
  .cine.cala b{color:#ffb07a;font-size:25px;letter-spacing:6px}
  .cine.round b{font-size:22px;letter-spacing:6px}
  .cine span{white-space:normal}
  @keyframes cineIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  @keyframes flickTxt{0%,100%{opacity:1}50%{opacity:.7}}

  .bub{
    position:absolute;left:5px;right:5px;bottom:4px;z-index:2;background:rgba(8,12,14,.95);
    border:1px solid var(--c-line);border-radius:7px;padding:3px 6px;font-size:10.5px;color:#e6ddca;
    line-height:1.35;animation:bubIn .22s ease both;font-family:"Songti SC","SimSun",serif;
  }
  .bub::before{content:"";position:absolute;left:9px;top:-5px;border:5px solid transparent;border-bottom-color:var(--c-line)}
  @keyframes bubIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .sbtn em{font-size:9.5px;font-style:normal;color:#c9b489;letter-spacing:.5px;display:block;
    margin-top:3px;padding-top:3px;border-top:1px dashed var(--line)}
  .hero.win{animation:winIn .7s cubic-bezier(.2,.9,.3,1.25) both}
  .hero.lose{color:#e08c78;animation:loseIn .55s ease both}
  @keyframes winIn{from{opacity:0;transform:scale(.82);letter-spacing:14px}to{opacity:1;transform:none;letter-spacing:6px}}
  @keyframes loseIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
  .quote{font-family:"Songti SC","SimSun",serif;font-size:12.5px;color:#c9b489;text-align:center;margin:8px 0 2px;line-height:1.5}
  .resbox.six{grid-template-columns:1fr 1fr}
  .btn.small{flex:0 0 38%}
  @media (prefers-reduced-motion:reduce){
    .beast.shake,.room.shake,.lamp.dying u,.cine b{animation:none}
    .fnum{animation-duration:.8s}
  }
</style>

<script>
"use strict";
/* ============ 常量与数据 ============ */
var CFG = {
  BEAST_MAX: 72,      // 三盏灯，每盏 24 灯火（本作设定）
  LAMP: 24,
  SEASON_HP: 10,
  HAND_MAX: 6,
  ROUNDS: 8,
  AMP_STEP: 0.2,      // 每多一房同击 +20%
  AMP_MAX: 3,         // 最多 +60%
  SHIELD_MAX: 6,
  WEAKEN_MAX: 8,
  RAGE_ROUND: 5,      // 第 5 回合起狂化
  RAGE_HP: 24         // 灯火 ≤24（只剩最后一盏灯）时暴怒
};

var SEASON_DEF = {
  spring:{ name:"春", c:"#e6a3bd", bg:"#241a20", line:"#6d4657", house:"粉房",
    passive:"生发", pdesc:"你许愿后，若本轮尚无人攻击年兽，抽 1 签" },
  summer:{ name:"夏", c:"#7fbf7a", bg:"#17241a", line:"#3f6b48", house:"绿房",
    passive:"炎烈", pdesc:"你的每一次攻击额外 +1 伤害" },
  autumn:{ name:"秋", c:"#dda447", bg:"#262013", line:"#6e5326", house:"橘房",
    passive:"肃杀", pdesc:"本轮已有别人攻击过时，你的攻击额外 +2 伤害" },
  winter:{ name:"冬", c:"#7faed6", bg:"#151f28", line:"#3b5f78", house:"蓝房",
    passive:"守藏", pdesc:"回合结束时若你未受伤，全队护盾 +1；且「爆竹」只在你手上有效" }
};
var ORDER = ["spring","summer","autumn","winter"];

/* 14 种签：el=归属季节；d=基础伤害；dh=本季伤害；ex=基础附加；exh=本季附加 */
var CARDS = {
  taofu:{ n:"桃符", el:"spring", t:"atk", d:2, dh:4, tx:"桃符换旧，灼烧年兽" },
  chunfeng:{ n:"春风", el:"spring", t:"sup", ex:{draw:1}, exh:{draw:2}, tx:"春风送签，抽签" },
  chunlei:{ n:"春雷", el:"spring", t:"atk", d:3, dh:5, pierce:true, tx:"惊雷贯耳，无视护盾" },
  aicao:{ n:"艾草", el:"summer", t:"sup", ex:{shieldAll:1}, exh:{shieldAll:2}, tx:"艾草熏房，全队护盾" },
  longzhou:{ n:"龙舟", el:"summer", t:"atk", d:2, dh:4, ex:{shieldSelf:1}, exh:{shieldSelf:2}, tx:"击鼓竞渡，伤敌自守" },
  pushan:{ n:"蒲扇", el:"summer", t:"sup", ex:{weaken:2}, exh:{weaken:4}, tx:"扇灭灾厄威势" },
  daosui:{ n:"稻穗", el:"autumn", t:"sup", ex:{healAll:1}, exh:{healAll:2}, tx:"秋收续命，全队回血" },
  qiulie:{ n:"秋猎", el:"autumn", t:"atk", d:4, dh:6, ex:{selfLoss:1}, tx:"围猎年兽，自损 1" },
  shuangjiang:{ n:"霜降", el:"autumn", t:"atk", d:1, dh:3, ex:{weaken:2}, tx:"霜封灾厄，兼伤年兽" },
  baozhu:{ n:"爆竹", el:"winter", t:"atk", d:3, dh:6, onlyHome:true, tx:"辞旧岁，仅冬季有效" },
  shousui:{ n:"守岁", el:"winter", t:"sup", ex:{shieldAll:1, healAll:1}, exh:{shieldAll:2, healAll:1}, tx:"守夜护全队" },
  lamei:{ n:"腊梅", el:"winter", t:"atk", d:1, dh:2, ex:{draw:1}, tx:"寒梅著花，伤敌抽签" },
  dengmi:{ n:"灯谜", el:null, t:"sup", ex:{draw:2}, exh:{draw:2}, tx:"猜灯谜，抽两签" },
  yasui:{ n:"压岁", el:null, t:"sup", ex:{shieldAll:1, healAll:1, revive:3}, exh:{shieldAll:1, healAll:1, revive:3}, tx:"压岁钱，护佑全队、唤回倒下者" }
};

/* 年兽的 8 支灾厄签，顺序固定、开局即可预判 */
var CALAMITIES = [
  { n:"沙暴", tx:"黄沙蔽日", fx:{kind:"all", dmg:3}, d:"全场各 3 伤" },
  { n:"地震", tx:"地裂屋摇", fx:{kind:"all", dmg:2, discard:1}, d:"全场各 2 伤，每房弃 1 签" },
  { n:"蝗灾", tx:"虫食签筒", fx:{kind:"all", dmg:2, discardAtk:1}, d:"全场各 2 伤，每房弃 1 张攻签" },
  { n:"寒流", tx:"朔风透骨", fx:{kind:"exceptWinter", dmg:3}, d:"除冬房外各 3 伤" },
  { n:"洪涝", tx:"浊水灌房", fx:{kind:"all", dmg:3, clearShield:true}, d:"全场护盾清零，再各 3 伤" },
  { n:"毒瘴", tx:"瘴气弥漫", fx:{kind:"random2", dmg:5, discard:1}, d:"随机两房各 5 伤、各弃 1 签" },
  { n:"山火", tx:"烈焰燎原", fx:{kind:"all", dmg:2, extra:5}, d:"全场各 2 伤，另有一房额外 5 伤" },
  { n:"冰雹", tx:"雹砸玻璃", fx:{kind:"all", dmg:5}, d:"全场各 5 伤" }
];

/* 牌堆：按权重组成，循环发牌 */
var DECK_LIST = ["taofu","taofu","chunfeng","chunlei","chunlei","aicao","aicao",
  "longzhou","longzhou","pushan","pushan","daosui","daosui","qiulie","qiulie",
  "shuangjiang","baozhu","baozhu","shousui","shousui","lamei","dengmi","yasui"];

/* ============ 工具 ============ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rndInt(n){ return Math.floor(G.rng() * n); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function pick(arr){ return arr[rndInt(arr.length)]; }
function seasonName(k){ return SEASON_DEF[k].name; }

/* ============ 状态 ============ */
var G = null;

function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=rndInt(i+1); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function log(text, cls){
  if(!G) return;
  G.log.push({ r:G.round||1, t:text, c:cls||"" });
  if(G.log.length > 500) G.log.splice(0, G.log.length-500);
}

function aliveKeys(){ return ORDER.filter(function(k){ return !G.rooms[k].down; }); }
function downedKeys(){ return ORDER.filter(function(k){ return G.rooms[k].down; }); }
function ampMult(){ return 1 + Math.min(CFG.AMP_MAX, G.attackers.length) * CFG.AMP_STEP; }

function newGame(playerSeason, seed, opts){
  opts = opts || {};
  var sd = seed || (Date.now() + Math.floor(Math.random()*100000));
  G = {
    seed: sd,
    rng: mulberry32(sd),
    player: playerSeason || "spring",
    auto: !!opts.auto,
    strategy: opts.strategy || null,
    round: 0, turn: 0,
    rooms: {}, deck: [], log: [],
    beast: { hp: CFG.BEAST_MAX, rage:false, fury:false },
    weaken: 0, attackers: [],
    roundDone: false,
    over: null, overAt: null,
    acting: null, bubble: null, said: {}, furySeen: false, opened: false, lastFeed: null,
    stats: { dealt:0, taken:0, downed:0, wished:0, fed:0,
             comboHits:0, comboBest:0, roundDealt:0, maxRound:0 }
  };
  ORDER.forEach(function(k){
    G.rooms[k] = { key:k, hp:CFG.SEASON_HP, shield:0, hand:[], down:false, acted:false, took:0 };
  });
  G.deck = shuffle(DECK_LIST.slice());
  /* 开局每人 2 支不同的签 */
  ORDER.forEach(function(k){
    var hand = G.rooms[k].hand;
    for(var i=0;i<2;i++){
      if(!G.deck.length) G.deck = shuffle(DECK_LIST.slice());
      var id = G.deck.pop(), tries = 0;
      while(hand[0] === id && tries < 8){
        G.deck.push(id);
        G.deck = shuffle(G.deck);
        id = G.deck.pop();
        tries++;
      }
      hand.push(id);
    }
  });
  log("开局：四房各持 2 支签，年兽头顶 3 盏灯（" + CFG.BEAST_MAX + " 灯火）", "sys");
  beginRound();
}

function drawOne(k, silent){
  var r = G.rooms[k];
  if(!r || r.down) return null;
  if(r.hand.length >= CFG.HAND_MAX){
    if(!silent) log(seasonName(k) + "房签筒已满（6 支），新签不入", "sys");
    return null;
  }
  if(!G.deck.length) G.deck = shuffle(DECK_LIST.slice());
  var id = G.deck.pop();
  r.hand.push(id);
  return id;
}

/* ============ 伤害与治疗 ============ */
function lampIndex(hp){ return hp<=0 ? 0 : Math.ceil(hp/CFG.LAMP); }

function hitBeast(n, label, cls){
  n = Math.round(n);
  if(n <= 0) return 0;
  var before = lampIndex(G.beast.hp);
  var real = Math.min(n, G.beast.hp);
  G.beast.hp = Math.max(0, G.beast.hp - n);
  G.stats.dealt += real;
  G.stats.roundDealt += real;
  if(G.stats.roundDealt > G.stats.maxRound) G.stats.maxRound = G.stats.roundDealt;
  var after = lampIndex(G.beast.hp);
  if(after < before && after > 0){
    log("第 " + (after+1) + " 盏灯灭了！年兽只剩 " + after + " 盏", "big");
  }
  if(G.beast.hp <= CFG.RAGE_HP && !G.beast.fury){
    G.beast.fury = true;
    log("年兽暴怒：只剩最后一盏灯，全部灾厄再 +1 伤", "warn");
  }
  if(G.beast.hp === 0 && !G.over){
    G.over = { win:true, reason:"年兽灯火尽灭" };
    G.overAt = G.round;
    log("三盏灯全灭，年兽退去——四房生还", "big");
  }
  return n;
}

function downRoom(k){
  var r = G.rooms[k];
  if(!r || r.down) return;
  r.down = true;
  r.hp = 0;
  r.hand = [];
  r.shield = 0;
  G.stats.downed++;
  log(seasonName(k) + "房的人倒下了，手中签全部散落", "warn");
}

function damageRoom(k, amount, opts){
  opts = opts || {};
  var r = G.rooms[k];
  if(!r || r.down) return 0;
  var amt = amount - G.weaken;
  if(amt <= 0){ log(seasonName(k) + "房被护住（蒲扇折损灾厄），未受伤", "sys"); return 0; }
  if(!opts.pierce){
    var ab = Math.min(r.shield, amt);
    if(ab > 0){ r.shield -= ab; amt -= ab; }
  }
  if(amt <= 0) return 0;
  r.hp = Math.max(0, r.hp - amt);
  r.took += amt;
  G.stats.taken += amt;
  if(r.hp <= 0) downRoom(k);
  return amt;
}

function healAll(n){
  var healed = 0;
  aliveKeys().forEach(function(k){
    var r = G.rooms[k];
    var h = Math.min(n, CFG.SEASON_HP - r.hp);
    if(h > 0){ r.hp += h; healed += h; }
  });
  return healed;
}
function shieldAll(n){
  var given = 0;
  aliveKeys().forEach(function(k){
    var r = G.rooms[k];
    var g = Math.min(n, CFG.SHIELD_MAX - r.shield);
    if(g > 0){ r.shield += g; given += g; }
  });
  return given;
}
function reviveAll(hp){
  var n = 0;
  downedKeys().forEach(function(k){
    var r = G.rooms[k];
    r.down = false; r.hp = Math.min(hp, CFG.SEASON_HP); r.shield = 1; n++;
    log(seasonName(k) + "房被「压岁」唤回，气血 " + r.hp + "、护盾 1", "good");
  });
  return n;
}

/* ============ 出签结算 ============ */
function effOf(cardId, k){
  var c = CARDS[cardId];
  var home = c.el === k;
  var ex = Object.assign({}, home ? (c.exh || c.ex || {}) : (c.ex || {}));
  var dmg = 0;
  if(c.t === "atk"){
    dmg = home ? (c.dh || 0) : (c.d || 0);
    if(k === "summer") dmg += 1;
    if(k === "autumn" && G.attackers.some(function(x){ return x !== k; })) dmg += 2;
    dmg = Math.max(1, Math.round(dmg * ampMult()));
  }
  return { dmg:dmg, ex:ex, pierce:!!c.pierce, home:home };
}

function canWish(k, cardId){
  var c = CARDS[cardId];
  if(c.onlyHome && c.el !== k) return false;
  return true;
}

function doWish(k, idx){
  var r = G.rooms[k];
  var id = r.hand[idx];
  if(!id) return { ok:false, msg:"没有这支签" };
  var c = CARDS[id];
  if(c.onlyHome && c.el !== k) return { ok:false, msg:"「" + c.n + "」只在冬季有效" };
  var attackersBefore = G.attackers.length;
  var eff = effOf(id, k);
  r.hand.splice(idx, 1);
  r.acted = true;
  G.stats.wished++;
  var bits = [];
  if(eff.dmg > 0){
    hitBeast(eff.dmg, c.n);
    G.attackers.push(k);
    if(attackersBefore >= 1) G.stats.comboHits++;
    if(G.attackers.length > G.stats.comboBest) G.stats.comboBest = G.attackers.length;
    bits.push("年兽 -" + eff.dmg);
    if(attackersBefore > 0){
      bits.push("合击 +" + Math.round(Math.min(CFG.AMP_MAX, attackersBefore) * CFG.AMP_STEP * 100) + "%");
    }
  }
  var ex = eff.ex;
  if(ex.shieldAll){ var g1 = shieldAll(ex.shieldAll); if(g1) bits.push("全队护盾 +" + ex.shieldAll); }
  if(ex.shieldSelf){ var g2 = shieldAllFor(k, ex.shieldSelf); if(g2) bits.push("自身护盾 +" + g2); }
  if(ex.healAll){ var h1 = healAll(ex.healAll); if(h1) bits.push("全队回血 " + h1); }
  if(ex.draw){ for(var i=0;i<ex.draw;i++){ drawOne(k, true); } bits.push("抽 " + ex.draw + " 签"); }
  if(ex.weaken){ G.weaken = clamp(G.weaken + ex.weaken, 0, CFG.WEAKEN_MAX); bits.push("本轮灾厄 -" + ex.weaken); }
  if(ex.revive && downedKeys().length){ reviveAll(ex.revive); bits.push("唤回倒下者"); }
  if(ex.selfLoss){ damageRoom(k, ex.selfLoss, {pierce:true}); bits.push("自损 " + ex.selfLoss); }
  /* 春：生发 —— 若此前无人攻击，许愿后补 1 签 */
  if(k === "spring" && attackersBefore === 0){
    drawOne(k, true);
    bits.push("生发：补抽 1 签");
  }
  log(seasonName(k) + "房许愿「" + c.n + "」" + (bits.length ? "：" + bits.join("、") : ""), eff.dmg > 0 ? "big" : "");
  return { ok:true, dmg:eff.dmg, name:c.n };
}

function shieldAllFor(k, n){
  var r = G.rooms[k];
  var g = Math.min(n, CFG.SHIELD_MAX - r.shield);
  if(g > 0) r.shield += g;
  return g;
}

function nextAlive(k){
  var i = ORDER.indexOf(k);
  for(var s=1;s<=4;s++){
    var t = ORDER[(i+s)%4];
    if(!G.rooms[t].down) return t;
  }
  return null;
}

function doFeed(k, idx){
  var r = G.rooms[k];
  var id = r.hand[idx];
  if(!id) return { ok:false, msg:"没有这支签" };
  var to = nextAlive(k);
  if(!to) return { ok:false, msg:"无人在场" };
  if(G.rooms[to].hand.length >= CFG.HAND_MAX) return { ok:false, msg:seasonName(to) + "房签筒已满" };
  r.hand.splice(idx, 1);
  G.rooms[to].hand.push(id);
  r.acted = true;
  G.stats.fed++;
  G.lastFeed = { from:k, to:to, n:CARDS[id].n };
  log(seasonName(k) + "房左孔馈赠「" + CARDS[id].n + "」→ " + seasonName(to) + "房", "good");
  return { ok:true, to:to, name:CARDS[id].n };
}

function grantCard(k, id){
  var r = G.rooms[k];
  if(r.hand.length >= CFG.HAND_MAX){
    /* 满签时新得的签挤掉最旧的一张，避免卡死 */
    r.hand.shift();
    log(seasonName(k) + "房签筒已满，最旧的一签散去", "sys");
  }
  r.hand.push(id);
}

/* ============ 回合流程 ============ */
function phaseName(){
  if(G.beast.hp <= CFG.RAGE_HP) return "暴怒";
  if(G.round >= CFG.RAGE_ROUND) return "狂化";
  return "常态";
}
function phaseBonus(){
  return (G.round >= CFG.RAGE_ROUND ? 1 : 0) + (G.beast.hp <= CFG.RAGE_HP ? 1 : 0);
}
function curCalamity(){ return CALAMITIES[clamp((G.round||1)-1, 0, CALAMITIES.length-1)]; }

function beginRound(){
  if(G.over) return;
  G.round++;
  if(G.round > CFG.ROUNDS){ lose("八回合耗尽，年兽未灭"); return; }
  G.turn = 0;
  G.roundDone = false;
  G.attackers = [];
  G.weaken = 0;
  G.acting = null;
  G.said = {};
  G.stats.roundDealt = 0;
  ORDER.forEach(function(k){
    var r = G.rooms[k];
    r.acted = false;
    r.took = 0;
    if(!r.down) drawOne(k, true);
  });
  if(G.round === CFG.RAGE_ROUND - 1){
    log("预告：下回合（第 " + CFG.RAGE_ROUND + " 回合）年兽狂化，全部灾厄 +1 伤", "warn");
  }
  if(G.round === CFG.RAGE_ROUND && !G.beast.rage){
    G.beast.rage = true;
    log("第 " + G.round + " 回合起，年兽进入狂化：每支灾厄 +1 伤", "warn");
  }
  if(G.beast.hp <= CFG.RAGE_HP && !G.beast.fury){
    G.beast.fury = true;
    log("年兽暴怒：灯火将尽，灾厄再 +1 伤", "warn");
  }
  var c = curCalamity();
  log("第 " + G.round + " 回合 · 四房各补 1 签 · 年兽亮出灾厄「" + c.n + "」（" + c.tx + "）", "sys");
}

function lose(reason){
  if(G.over) return;
  G.over = { win:false, reason:reason };
  G.overAt = G.round;
  log("败局：" + reason, "warn");
}

function applyCalamityDamage(c, targets, bonus, summary){
  targets.forEach(function(k){
    var r = G.rooms[k];
    if(!r || r.down) return;
    var d = damageRoom(k, c.fx.dmg + bonus);
    summary.push(seasonName(k) + (d ? " -" + d : " 无损"));
  });
}

function discardSome(k, mode){
  var r = G.rooms[k];
  if(!r || r.down || !r.hand.length) return null;
  var idx = rndInt(r.hand.length);
  if(mode === "atk"){
    var atkIdx = [];
    r.hand.forEach(function(id,i){ if(CARDS[id].t === "atk") atkIdx.push(i); });
    if(atkIdx.length) idx = pick(atkIdx);
    else return null;
  }
  var id = r.hand.splice(idx,1)[0];
  return CARDS[id].n;
}

function resolveCalamity(){
  if(G.over) return;
  var c = curCalamity();
  var bonus = phaseBonus();
  var alive = aliveKeys();
  var summary = [];
  var discarded = [];
  if(!alive.length){ lose("全员倒下"); return; }

  if(c.fx.clearShield){
    alive.forEach(function(k){ G.rooms[k].shield = 0; });
    summary.push("护盾被浊水冲散");
  }

  var targets = [];
  if(c.fx.kind === "all" || c.fx.kind === "random2" || c.fx.kind === "extra"){
    if(c.fx.kind === "all") targets = alive.slice();
    else targets = shuffle(alive.slice()).slice(0, Math.min(2, alive.length));
  } else if(c.fx.kind === "exceptWinter"){
    targets = alive.filter(function(k){ return k !== "winter"; });
  }
  applyCalamityDamage(c, targets, bonus, summary);

  if(c.fx.kind === "all" && c.fx.extra){
    var exAlive = aliveKeys();
    if(exAlive.length){
      var tk = pick(exAlive);
      var r0 = G.rooms[tk];
      var d0 = damageRoom(tk, c.fx.extra + bonus);
      summary.push("烈焰专焚" + seasonName(tk) + (d0 ? " -" + d0 : " 无损"));
    }
  }

  var dm = c.fx.discard || 0, dmAtk = c.fx.discardAtk || 0;
  if(dm || dmAtk){
    var tset = targets.slice();
    if(c.fx.kind === "all" && c.fx.extra){ /* 山火不弃签 */ }
    tset.forEach(function(k){
      var rounds = Math.max(dm, dmAtk);
      for(var i=0;i<rounds;i++){
        var nm = discardSome(k, dmAtk ? "atk" : "any");
        if(nm) discarded.push(seasonName(k) + "「" + nm + "」");
      }
    });
  }

  var head = "年兽放出第 " + (G.round) + " 支灾厄「" + c.n + "」" + c.tx +
    "（" + c.d + (bonus ? "，阶段 +" + bonus : "") + "）";
  log(head, "warn");
  log("　结算：" + summary.join(" / "), "warn");
  if(discarded.length) log("　散签：" + discarded.join("、"), "");

  /* 冬房守藏：自身无伤 → 全队护盾 +1 */
  var wr = G.rooms.winter;
  if(wr && !wr.down && wr.took === 0){
    var gs = shieldAll(1);
    if(gs) log("冬房守藏：全队护盾 +1", "good");
  }

  if(!aliveKeys().length){ lose("全员倒下"); return; }
  if(G.beast.hp <= 0) return;
  if(G.round >= CFG.ROUNDS){ lose("八回合耗尽，年兽还剩 " + G.beast.hp + " 灯火"); return; }
  G.roundDone = true;
}

/* ============ AI ============ */
function forecast(){
  var c = curCalamity();
  var bonus = phaseBonus();
  var alive = aliveKeys();
  var per = {};
  ORDER.forEach(function(k){ per[k] = 0; });
  var raw = Math.max(0, c.fx.dmg + bonus - G.weaken);
  if(!alive.length) return per;
  var kind = c.fx.kind;
  if(kind === "all"){
    alive.forEach(function(k){
      per[k] = raw;
      if(c.fx.extra) per[k] += (c.fx.extra + bonus - G.weaken) / alive.length;
    });
  } else if(kind === "exceptWinter"){
    alive.forEach(function(k){ if(k !== "winter") per[k] = raw; });
  } else if(kind === "random2"){
    var p = Math.min(2, alive.length) / alive.length;
    alive.forEach(function(k){ per[k] = raw * p; });
  } else if(kind === "extra"){
    alive.forEach(function(k){ per[k] = raw * 2 / alive.length; });
  }
  return per;
}

/* 卡的静态价值：只看“这支签在这间房值多少”，用于馈赠判断 */
function grade(id, s){
  var c = CARDS[id];
  if(c.onlyHome && c.el !== s) return 0;
  var home = c.el === s;
  var ex = home ? (c.exh || c.ex || {}) : (c.ex || {});
  var v = 0;
  if(c.t === "atk"){
    v += (home ? c.dh : c.d) * 1.9;
    if(c.pierce) v += 1.5;
    if(s === "summer") v += 1.6;
    if(s === "autumn") v += 2.4;
  }
  if(ex.shieldAll) v += ex.shieldAll * 2.4;
  if(ex.shieldSelf) v += ex.shieldSelf * 1.1;
  if(ex.healAll) v += ex.healAll * 2.6;
  if(ex.draw) v += ex.draw * 1.7;
  if(ex.weaken) v += ex.weaken * 1.0;
  if(ex.revive) v += 5;
  if(ex.selfLoss) v -= 1.4;
  return v;
}

function incomingOn(x, per, noShield){
  var inc = Math.max(0, per[x] || 0);
  if(noShield) return inc;
  return Math.max(0, inc - G.rooms[x].shield);
}

/* 救场：本轮灾厄会打死谁，就找能补多少伤口的签 */
function pickSave(k, targets, per, noShield){
  var best = null, bestV = 0;
  G.rooms[k].hand.forEach(function(id, i){
    var e = effOf(id, k), ex = e.ex;
    var v = 0;
    targets.forEach(function(t){
      var q = G.rooms[t];
      var inc = incomingOn(t, per, noShield);
      var gap = inc - q.hp + 1;
      if(gap <= 0) return;
      var heal = ex.healAll || 0;
      var sh = (ex.shieldAll || 0) + (t === k ? (ex.shieldSelf || 0) : 0);
      if(!noShield) v += Math.min(gap, heal + sh);
      else v += Math.min(gap, heal);
    });
    if(ex.weaken && !noShield) v += Math.min(2, ex.weaken);
    if(ex.revive && downedKeys().length) v += 6;
    if(e.dmg > 0) v -= 2;   /* 先救场，但顺带能打也不亏 */
    if(v > bestV){ bestV = v; best = i; }
  });
  if(best === null || bestV < 1) return null;
  return { kind:"wish", idx:best, save:true };
}

function bestAttack(k){
  var best = null, bestD = 0;
  G.rooms[k].hand.forEach(function(id, i){
    var e = effOf(id, k);
    if(e.dmg > bestD){ bestD = e.dmg; best = i; }
  });
  if(best === null) return null;
  return { kind:"wish", idx:best, dmg:bestD };
}

function bestFeed(k){
  var r = G.rooms[k], best = null, bestGain = 0;
  r.hand.forEach(function(id, i){
    var mine = grade(id, k);
    ORDER.forEach(function(t){
      if(t === k || G.rooms[t].down) return;
      var tr = G.rooms[t];
      if(tr.hand.length >= CFG.HAND_MAX) return;
      var gain = grade(id, t) - mine;
      if(tr.acted) gain -= 2;
      if(gain > bestGain){ bestGain = gain; best = { kind:"feed", idx:i, to:t, gain:gain, mine:mine }; }
    });
  });
  return best;
}

function bestSupport(k){
  var best = null, bestV = 0;
  G.rooms[k].hand.forEach(function(id, i){
    var e = effOf(id, k);
    if(e.dmg > 0) return;
    var v = grade(id, k) * 0.5;
    if(!v) v = 0.5;
    if(v > bestV){ bestV = v; best = i; }
  });
  if(best === null) return null;
  return { kind:"wish", idx:best };
}

function aiDecide(k){
  var r = G.rooms[k];
  if(!r.hand.length) return { kind:"skip" };
  var per = forecast();
  var noShield = !!curCalamity().fx.clearShield;

  /* 1. 能一举打灭最后一盏灯，立刻打 */
  for(var i=0;i<r.hand.length;i++){
    var e0 = effOf(r.hand[i], k);
    if(e0.dmg > 0 && e0.dmg >= G.beast.hp) return { kind:"wish", idx:i, dmg:e0.dmg };
  }

  /* 2. 本轮灾厄会打死人：先救 */
  var doomed = aliveKeys().filter(function(x){
    var q = G.rooms[x];
    return q.hp - incomingOn(x, per, noShield) <= 0;
  });
  if(doomed.length){
    var sv = pickSave(k, doomed, per, noShield);
    if(sv) return sv;
  }

  /* 3. 剩余回合还差多少：进度不够就只攻不守 */
  var roundsLeft = Math.max(1, CFG.ROUNDS - G.round + 1);
  var speed = teamSpeed();
  var urgent = G.beast.hp / roundsLeft > speed * 1.12;

  var selfRisk = r.hp - incomingOn(k, per, noShield);
  var othersLow = aliveKeys().some(function(x){ return x !== k && G.rooms[x].hp <= 3; });

  var atk = bestAttack(k);
  if(atk && (urgent || selfRisk > 2 || !othersLow)) return atk;

  if(selfRisk <= 2){
    var sv2 = pickSave(k, [k], per, noShield);
    if(sv2) return sv2;
  }
  if(othersLow){
    var sv3 = pickSave(k, aliveKeys().filter(function(x){ return G.rooms[x].hp <= 4; }), per, noShield);
    if(sv3) return sv3;
  }

  /* 7. 错季的签转手给对的人 */
  var f = bestFeed(k);
  if(f && f.gain >= 4.5 && f.mine < 5 && r.hand.length >= 3 &&
     G.rooms[f.to].hand.length <= 3 && !G.rooms[f.to].acted) return f;

  if(atk) return atk;

  var sup = bestSupport(k);
  if(sup) return sup;
  return { kind:"skip" };
}

/* 本队每回合平均能打出的伤害（用于判断进度） */
function teamSpeed(){
  var sum = 0;
  aliveKeys().forEach(function(k){
    var q = G.rooms[k], cnt = 0;
    q.hand.forEach(function(id){ if(CARDS[id].t === "atk" && canWish(k, id)) cnt++; });
    sum += Math.min(1.7, cnt) * 3.4;
  });
  return Math.max(3, sum);
}

function applyDecision(k, dec){
  var r = G.rooms[k];
  if(!r) return false;
  if(dec.kind === "wish"){
    if(doWish(k, dec.idx).ok) return true;
    if(r.hand.length){
      var i = rndInt(r.hand.length);
      if(canWish(k, r.hand[i]) && doWish(k, i).ok) return true;
      if(doFeed(k, i).ok) return true;
    }
    log(seasonName(k) + "房无签可出，空过", "sys");
    r.acted = true;
    return true;
  }
  if(dec.kind === "feed"){
    if(dec.idx != null && doFeed(k, dec.idx).ok) return true;
    if(r.hand.length){
      for(var i=0;i<r.hand.length;i++){ if(doFeed(k, i).ok) return true; }
    }
    log(seasonName(k) + "房无处可送，空过", "sys");
    r.acted = true;
    return true;
  }
  r.acted = true;
  log(seasonName(k) + "房按住签不出，本回合空过", "sys");
  return true;
}

function step(){
  if(G.over) return "over";
  if(G.turn >= 4){
    if(G.roundDone){ beginRound(); return "round"; }
    resolveCalamity();
    return "calamity";
  }
  var k = ORDER[G.turn];
  var r = G.rooms[k];
  if(r.down){ G.turn++; return "skip"; }
  if(k === G.player && !G.auto) return "wait";
  var dec = (G.auto && G.strategy && k === G.player) ? G.strategy(k) : aiDecide(k);
  applyDecision(k, dec);
  G.turn++;
  return "acted";
}

/* 自动对战（自测与平衡用） */
function autoRun(maxSteps){
  var n = 0;
  while(!G.over && n < (maxSteps || 400)){
    step();
    n++;
  }
  return { over:G.over, steps:n };
}

function diffFloat(before, actor){
  var bd = before.beast - G.beast.hp;
  if(bd > 0){
    var bb = $("beast-box");
    fxAt(bb, "-" + bd, "dmg");
    shakeEl(bb);
    bb.classList.add("hit");
    setTimeout(function(){ bb.classList.remove("hit"); }, 480);
    tickHp();
    var ib = lampIndex(before.beast), ia = lampIndex(G.beast.hp);
    if(ia < ib) fxAt(bb, "第 " + (ia + 1) + " 盏灯灭了", "lamp");
  }
  if(G.attackers.length > before.attackers){
    if(before.attackers === 0) fxAt($("beast-box"), "合击起", "amp");
    else fxAt($("beast-box"), "合击 +" + Math.round(CFG.AMP_STEP * 100) + "%", "amp");
  }
  ORDER.forEach(function(k){
    var a = before.rooms[k], r = G.rooms[k];
    if(r.hp < a.hp){ fxAt(roomEl(k), "-" + (a.hp - r.hp), "dmg"); shakeEl(roomEl(k)); }
    else if(r.hp > a.hp) fxAt(roomEl(k), "+" + (r.hp - a.hp), "heal");
    if(G.rooms[k].hand.length < a.hand){
      var fed = G.lastFeed && G.lastFeed.from === k;
      fxAt(roomEl(k), (fed ? "馈赠 -1" : "出签 -1"), "amp");
    } else if(G.rooms[k].hand.length > a.hand){
      fxAt(roomEl(k), "抽 +" + (G.rooms[k].hand.length - a.hand) + " 签", "amp");
    }
    if(G.lastFeed && G.lastFeed.to === k && a.hand < G.rooms[k].hand.length)
      fxAt(roomEl(k), "受赠 · " + G.lastFeed.n, "heal");
    if(a.shield > r.shield && !r.down){
      fxAt(roomEl(k), "盾抵 " + (a.shield - r.shield), "shield");
    }
    if(!a.down && r.down){ fxAt(roomEl(k), "倒下", "down"); shakeEl(roomEl(k)); }
    if(a.down && !r.down) fxAt(roomEl(k), "唤回", "heal");
  });
  G.lastFeed = null;
}

function syncLampText(){
  if(!G) return;
  var hp = (uiHp == null ? G.beast.hp : uiHp);
  var a = $("h-beast"), b = $("bs-lampno");
  if(a) a.textContent = lampIndex(hp) + " 盏";
  if(b) b.textContent = "还剩 " + lampIndex(hp) + " 盏灯";
}

function renderLamps(){
  if(!G) return;
  var box = $("lamps");
  if(!box) return;
  var hpShow = (uiHp == null ? G.beast.hp : uiHp);
  var lp = "";
  [3,2,1].forEach(function(j){
    var w = clamp(hpShow - (j-1)*CFG.LAMP, 0, CFG.LAMP) / CFG.LAMP * 100;
    var st = w <= 0 ? "out" : (w <= 45 ? "dying" : "lit");
    lp += '<div class="lamp ' + st + '"><i style="width:' + w + '%"></i>' +
      '<u style="left:' + Math.max(4, Math.round(w - 3)) + '%"></u></div>';
  });
  box.innerHTML = lp;
}

function tickHp(){
  if(!G) return;
  var target = G.beast.hp;
  var node = $("bs-hp");
  if(!node) return;
  if(uiHp == null){ uiHp = target; node.textContent = target; return; }
  if(hpAnim){ return; }
  if(uiHp === target){ node.textContent = target; return; }
  hpAnim = true;
  var from = uiHp, t0 = performance.now(), g = uiGen;
  (function frame(){
    if(g !== uiGen){ hpAnim = false; return; }
    var p = Math.min(1, (performance.now() - t0) / 430);
    uiHp = Math.round(from + (target - from) * p);
    node.textContent = uiHp;
    renderLamps();
    syncLampText();
    if(p < 1) requestAnimationFrame(frame);
    else { uiHp = target; hpAnim = false; node.textContent = target; renderLamps(); syncLampText(); }
  })();
}

function setStage(s){ uiStage = s; renderStage(); }
function renderStage(){
  var steps = document.querySelectorAll("#stage .st");
  var order = ["reveal", "act", "resolve", "summary"];
  var idx = order.indexOf(uiStage);
  Array.prototype.forEach.call(steps, function(n, i){
    n.classList.toggle("on", i === idx);
    n.classList.toggle("done", i < idx);
  });
}
function renderSeq(){
  var box = $("seq");
  if(!box || !G) return;
  box.innerHTML = ORDER.map(function(k){
    var r = G.rooms[k], cls = "sq";
    if(k === G.player) cls += " you";
    if(r.down) cls += " down";
    else if(G.turn >= 4 || r.acted) cls += " done";
    if(!r.down && G.turn < 4 && ORDER[G.turn] === k) cls += " on";
    return '<span class="' + cls + '" style="--c:' + SEASON_DEF[k].c + '">' + SEASON_DEF[k].name +
      '<i>' + (r.down ? "倒" : "签 " + r.hand.length) + '</i></span>';
  }).join("");
}

function cardBits(id, k){
  var c = CARDS[id], home = c.el === k;
  var ex = home ? (c.exh || c.ex || {}) : (c.ex || {});
  var bits = [];
  if(c.t === "atk") bits.push("攻 " + (home ? c.dh : c.d) + (c.pierce ? "（破盾）" : ""));
  if(ex.shieldAll) bits.push("全队盾+" + ex.shieldAll);
  if(ex.shieldSelf) bits.push("自盾+" + ex.shieldSelf);
  if(ex.healAll) bits.push("回血" + ex.healAll);
  if(ex.draw) bits.push("抽" + ex.draw);
  if(ex.weaken) bits.push("灾厄-" + ex.weaken);
  if(ex.revive) bits.push("唤回倒地");
  if(ex.selfLoss) bits.push("自损" + ex.selfLoss);
  return bits.join(" · ");
}

function cardElTag(id){
  var c = CARDS[id];
  if(!c.el) return { txt:"通用", c:"#8d7a4e" };
  return { txt:SEASON_DEF[c.el].name + "属", c:SEASON_DEF[c.el].c };
}

function render(){
  if(!G) return;
  $("h-round").textContent = clamp(G.round,1,CFG.ROUNDS) + "/8";
  $("h-phase").textContent = phaseName();
  $("h-beast").textContent = lampIndex(G.beast.hp) + " 盏";
  var amp = Math.round((ampMult()-1)*100);
  $("h-amp").textContent = amp > 0 ? "+" + amp + "%" : "—";
  $("bs-hpmax").textContent = CFG.BEAST_MAX;
  syncLampText();
  var bs = phaseName();
  $("bs-sub").textContent = bs === "常态" ? "常态 · 灾厄按序" :
    (bs === "狂化" ? "狂化 · 灾厄 +1 伤" : "暴怒 · 灾厄 +" + phaseBonus() + " 伤");
  $("beast-box").classList.toggle("rage", bs !== "常态");
  tickHp();

  /* 灯：亮 / 将灭 / 灭 */
  renderLamps();

  /* 合击 */
  var cb = $("combo");
  var nxt = Math.round(Math.min(CFG.AMP_MAX, G.attackers.length + 1) * CFG.AMP_STEP * 100);
  cb.textContent = "合击 ×" + G.attackers.length + " · +" + amp + "%" +
    (G.attackers.length < CFG.AMP_MAX ? "（再攻 1 房 → +" + nxt + "%）" : "（已满）");
  cb.classList.toggle("hot", amp > 0);

  /* 预告 */
  var om = "";
  if(G.beast.hp > CFG.RAGE_HP && G.beast.hp <= CFG.RAGE_HP + 10){
    om = "预警：灯火降至 " + CFG.RAGE_HP + " → 年兽暴怒（灾厄再 +1 伤）";
  } else if(G.round < CFG.RAGE_ROUND && G.round + 1 === CFG.RAGE_ROUND){
    om = "预告：下回合年兽狂化（灾厄 +1 伤）";
  }
  var on = $("omen");
  on.textContent = om;
  on.classList.toggle("flash", !!om);

  var c = curCalamity();
  var bonus = phaseBonus();
  $("ne-name").textContent = c.n;
  $("ne-desc").textContent = c.d + (bonus ? "（+" + bonus + "）" : "");

  renderStage();
  renderSeq();
  renderRooms();
  renderCards();
  renderLog();
  renderBar();
}

function renderRooms(){
  var html = "";
  ORDER.forEach(function(k){
    var d = SEASON_DEF[k], r = G.rooms[k];
    var isYou = k === G.player;
    var showing = uiRoom && uiRoom[k] ? uiRoom[k] : null;
    var hp = showing ? showing.hp : r.hp;
    var sh = showing ? showing.shield : r.shield;
    var acting = !G.over && ((G.acting && G.acting === k) ||
      (G.turn < 4 && ORDER[G.turn] === k));
    var pct = clamp(hp / CFG.SEASON_HP * 100, 0, 100);
    var usable = 0;
    r.hand.forEach(function(id){ if(canWish(k, id)) usable++; });
    var tags = "";
    if(isYou) tags += '<span class="tag gold">你</span>';
    if(sh > 0) tags += '<span class="tag">盾 ' + sh + '</span>';
    if(r.acted) tags += '<span class="tag">已出签</span>';
    if(r.took > 0) tags += '<span class="tag">本轮 -' + r.took + '</span>';
    var bub = (G.bubble && G.bubble.k === k) ? '<div class="bub">“' + G.bubble.text + '”</div>' : "";
    html +=
      '<div class="room' + (acting ? ' acting' : '') + (r.down ? ' down' : '') + '" ' +
      'data-k="' + k + '" style="--c:' + d.c + ';--c-bg:' + d.bg + ';--c-line:' + d.line + '">' +
        '<div class="glass"></div>' +
        '<div class="rm-top"><span class="rm-seal"></span>' +
        '<span class="rm-name">' + d.name + '</span>' +
        '<span class="rm-who' + (isYou ? ' you' : '') + '">' + (isYou ? '你' : 'AI') + '</span></div>' +
        '<div class="hpbar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="rm-meta"><span>气血 <b>' + hp + '</b>/' + CFG.SEASON_HP + '</span>' +
        '<span>签 <b>' + r.hand.length + '</b>·可用 <b>' + usable + '</b></span></div>' +
        '<div class="tags">' + tags + '</div>' + bub +
      '</div>';
  });
  $("rooms").innerHTML = html;
}

function renderCards(){
  var k = G.player, r = G.rooms[k];
  $("hand-who").textContent = SEASON_DEF[k].name + "房 · " + SEASON_DEF[k].passive;
  $("hand-cnt").textContent = r.hand.length + " 支 / 上限 " + CFG.HAND_MAX;
  var handKey = k + "|" + r.hand.join(",");
  var wrap = $("cards");
  if(!r.hand.length){
    wrap.innerHTML = '<div class="empty-hand">签筒空空，本回合只能空过</div>';
    lastHandKey = handKey;
    return;
  }
  if(sel >= r.hand.length) sel = -1;
  var myTurn = !G.over && ORDER[G.turn] === k && !pumping;
  var html = "";
  r.hand.forEach(function(id, i){
    var c = CARDS[id], tag = cardElTag(id);
    var usable = canWish(k, id);
    html +=
      '<div class="card' + (i === sel ? ' sel' : '') + (usable ? '' : ' idle') + (usable ? '' : ' warn') +
      (lastHandKey !== handKey ? ' enter' : '') + '" data-i="' + i + '" ' +
      'style="--c:' + tag.c + '">' +
        '<div class="band"></div>' +
        '<div class="cn">' + c.n + '</div>' +
        '<div class="cs" style="color:' + tag.c + '">' + tag.txt + '</div>' +
        '<div class="cm">' + cardBits(id, k) + '</div>' +
        '<div class="cf">' + (usable ? (c.el === k ? '本季·加成' : '非本季') :
            '仅冬季可用·请馈赠') + '</div>' +
      '</div>';
  });
  wrap.innerHTML = html;
  lastHandKey = handKey;
  Array.prototype.forEach.call(wrap.querySelectorAll(".card"), function(node){
    node.addEventListener("click", function(){
      if(pumping || G.over) return;
      sel = parseInt(node.getAttribute("data-i"), 10);
      renderCards();
      renderBar();
    });
  });
}

function renderLog(){
  var box = $("log");
  var items = G.log.slice(-80).map(function(it){
    return '<div class="li ' + it.c + '"><span class="rd">' + it.r + '</span>' + it.t + '</div>';
  }).join("");
  box.innerHTML = items || '<div class="li sys">尚未开局</div>';
  box.scrollTop = box.scrollHeight;
  $("log-cnt").textContent = G.log.length + " 条";
}

function paceLabel(){ return pace === 1 ? "快进 ×3" : "常速 ×1"; }
function togglePace(){
  pace = pace === 1 ? 0.32 : 1;
  var b = $("btn-pace");
  if(b){
    b.textContent = pace === 1 ? "演出 常速" : "快进 ×3";
    b.classList.toggle("on", pace !== 1);
  }
  renderBar();
}
function bindFF(){
  var b = $("b-ff");
  if(b) b.onclick = function(){ togglePace(); };
}

function renderBar(){
  var bar = $("btns");
  var k = G.player, r = G.rooms[k];
  if(G.over){
    $("ab-tip").textContent = "对局已结束";
    bar.innerHTML = '<button class="btn gold wide" id="b-again">查看结算</button>';
    $("b-again").onclick = showEnd;
    return;
  }
  var myTurn = !pumping && G.turn < 4 && ORDER[G.turn] === k && !r.down;
  if(!myTurn){
    var tip;
    if(r.down) tip = "你的房已倒下，只能旁观队友——等「压岁」唤回";
    else if(G.turn >= 4) tip = uiStage === "resolve" ? "年兽正在放出本轮灾厄…" :
      (uiStage === "summary" ? "回合收束，准备下一回合…" : "准备下一回合…");
    else if(uiStage === "reveal") tip = "年兽亮出「" + curCalamity().n + "」，看清再出签";
    else if(G.acting) tip = seasonName(G.acting) + "房正在出签…";
    else if(uiStage === "act") tip = "轮到 " + seasonName(ORDER[Math.min(G.turn,3)]) + " 房";
    else tip = "演出中…";
    $("ab-tip").textContent = tip;
    bar.innerHTML = '<button class="btn" disabled>' +
      (G.turn >= 4 ? "结算中…" : "等待队友") + '</button>' +
      '<button class="btn small" id="b-ff">' + paceLabel() + '</button>';
    bindFF();
    return;
  }
  var id = (sel >= 0 && sel < r.hand.length) ? r.hand[sel] : null;
  var pick = id ? CARDS[id] : null;
  var tip = "轮到你（" + seasonName(k) + "房）。";
  if(pick){
    var e = effOf(id, k);
    var bits = [];
    if(e.dmg) bits.push("年兽 -" + e.dmg);
    var t = cardBits(id, k).split(" · ").filter(function(x){ return x.indexOf("攻 ") !== 0; });
    if(t.length) bits.push(t.join("、"));
    tip = "选中「" + pick.n + "」：" + (bits.length ? bits.join("，") : "无附加效果");
    if(!canWish(k, id)) tip = "「" + pick.n + "」只在冬季有效，只能馈赠";
  } else if(!r.hand.length){
    tip = "签筒已空，只能空过";
  } else {
    tip = "点一张签，再选许愿或馈赠（本轮灾厄：" + curCalamity().n + "）";
  }
  $("ab-tip").innerHTML = tip;
  var canW = !!id && canWish(k, id);
  var to = nextAlive(k);
  var canF = !!id && !!to && G.rooms[to].hand.length < CFG.HAND_MAX;
  bar.innerHTML =
    '<button class="btn atk" id="b-wish"' + (canW ? '' : ' disabled') + '>' +
      '许愿' + (pick && canW ? '·' + pick.n : '') + '</button>' +
    '<button class="btn feed" id="b-feed"' + (canF ? '' : ' disabled') + '>' +
      '馈赠' + (to ? ' → ' + seasonName(to) : '') + '</button>' +
    '<button class="btn" id="b-skip">空过</button>';
  $("b-wish").onclick = function(){ playerAct("wish"); };
  $("b-feed").onclick = function(){ playerAct("feed"); };
  $("b-skip").onclick = function(){ playerAct("skip"); };
}

function toast(msg){
  var t = $("toast");
  if(!t){
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;bottom:96px;transform:translateX(-50%);" +
      "background:#1c282e;border:1px solid #3d5560;color:#e8dfcd;padding:8px 14px;" +
      "border-radius:8px;font-size:12.5px;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.5);" +
      "max-width:80vw;text-align:center;transition:opacity .2s";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.style.opacity = "0"; }, 1600);
}

function playerAct(kind){
  if(!G || G.over || pumping || busy) return;
  var k = G.player;
  if(G.turn >= 4 || ORDER[G.turn] !== k || G.rooms[k].down){
    toast("现在还没轮到你");
    return;
  }
  var before = takeSnap();
  if(kind === "wish" || kind === "feed"){
    if(sel < 0 || sel >= G.rooms[k].hand.length){
      toast("先点一张签");
      return;
    }
    var res = kind === "wish" ? doWish(k, sel) : doFeed(k, sel);
    if(!res.ok){
      toast(res.msg || "这一步不成立");
      return;
    }
  } else {
    applyDecision(k, { kind:"skip" });
  }
  var g = uiGen;
  sel = -1;
  G.acting = k;
  pumping = true;
  render();
  diffFloat(before, k);
  afterFury(g, k).then(function(){
    if(g !== uiGen) return;
    G.acting = null;
    maybeTeammateLines(k, before);
    wait(220).then(function(){
      if(g !== uiGen) return;
      G.turn++;
      render();
      runDirector(g);
    });
  }).catch(function(){});
}

/* ============ 回合分段演出 ============ */
async function afterFury(g, actor){
  if(!G || !G.beast || !G.beast.fury || G.furySeen) return;
  G.furySeen = true;
  var sp = firstAiAlive();
  if(sp) speak(sp, "fury");
  render();
  await showCine(g, "fury", "暴 怒", "只剩最后一盏灯 · 全部灾厄再 +1 伤", 1150);
  genOK(g);
}

function maybeTeammateLines(k, before){
  if(!G || G.over) return;
  if(G.attackers.length > before.attackers && G.attackers.length >= 2){
    var sp = (k !== G.player && !G.rooms[k].down) ? k : firstAiAlive();
    if(sp) speak(sp, "combo");
  }
  if(k !== G.player && !G.rooms[k].down && G.rooms[k].hp <= 3) speak(k, "danger");
}

function speakDownLines(before){
  ORDER.forEach(function(x){
    if(before.rooms[x].down || !G.rooms[x].down) return;
    if(x === G.player){
      var sp = firstAiAlive();
      if(sp) speak(sp, "down");
    } else {
      speak(x, "down", true);
    }
  });
}

async function roundOpen(g, first){
  if(!first){
    step();
    if(G.over) return;
  }
  genOK(g);
  G.opened = true;
  setStage("reveal");
  pumping = true;
  render();
  var c = curCalamity();
  var sub = "年兽亮出「" + c.n + "」· " + c.tx;
  if(G.round + 1 === CFG.RAGE_ROUND) sub += " · 预告：下回合狂化";
  await showCine(g, "round", "第 " + G.round + " 回合", sub, 820);
  genOK(g);
  if(G.round + 1 === CFG.RAGE_ROUND){
    var sp0 = firstAiAlive();
    if(sp0) speak(sp0, "rage");
  }
  if(G.round === CFG.RAGE_ROUND){
    var sp = firstAiAlive();
    if(sp) speak(sp, "rage");
    render();
    await showCine(g, "rage", "狂 化", "第 5 回合起 · 每支灾厄 +1 伤", 1250);
    genOK(g);
  }
  setStage("act");
  render();
}

function animateRoom(g, k, from){
  return new Promise(function(res){
    var to = { hp:G.rooms[k].hp, shield:G.rooms[k].shield };
    var el = roomEl(k);
    var dmg = from.hp - to.hp;
    if(el){
      if(dmg > 0){ fxAt(el, "-" + dmg, "dmg"); shakeEl(el); }
      if(to.hp > from.hp) fxAt(el, "+" + (to.hp - from.hp), "heal");
      if(from.shield > to.shield && !G.rooms[k].down){
        fxAt(el, curCalamity().fx.clearShield ? "护盾冲散" : "盾抵 " + (from.shield - to.shield), "shield");
      }
      if(G.rooms[k].down) fxAt(el, "倒下", "down");
    }
    var t0 = performance.now();
    (function frame(){
      if(g !== uiGen){ res(); return; }
      var p = Math.min(1, (performance.now() - t0) / 340);
      uiRoom[k] = {
        hp: Math.round(from.hp + (to.hp - from.hp) * p),
        shield: Math.round(from.shield + (to.shield - from.shield) * p)
      };
      renderRooms();
      if(p < 1) requestAnimationFrame(frame);
      else { uiRoom[k] = to; renderRooms(); res(); }
    })();
  });
}

async function calamityStage(g){
  setStage("resolve");
  pumping = true;
  var before = takeSnap();
  resolveCalamity();
  uiRoom = {};
  ORDER.forEach(function(k){
    if(!before.rooms[k].down) uiRoom[k] = { hp:before.rooms[k].hp, shield:before.rooms[k].shield };
  });
  render();
  var c = curCalamity();
  var bonus = phaseBonus();
  await showCine(g, "cala", "灾 厄 · " + c.n,
    c.tx + " · " + c.d + (bonus ? "（阶段 +" + bonus + "）" : ""), 900);
  genOK(g);
  for(var i = 0; i < ORDER.length; i++){
    var k = ORDER[i];
    if(before.rooms[k].down) continue;
    if(G.rooms[k].hp !== before.rooms[k].hp || G.rooms[k].shield !== before.rooms[k].shield){
      await animateRoom(g, k, before.rooms[k]);
      genOK(g);
    }
  }
  uiRoom = null;
  render();
  if(G.over) return;
  speakDownLines(before);
  setStage("summary");
  render();
  await wait(430);
  genOK(g);
}

async function runDirector(g){
  if(!G || g !== uiGen) return;
  if(busy) return;
  busy = true;
  pumping = true;
  try{
    if(!G.opened){
      await roundOpen(g, true);
      genOK(g);
    }
    while(g === uiGen && G && !G.over){
      if(G.turn >= 4){
        if(G.roundDone){ await roundOpen(g, false); genOK(g); continue; }
        await calamityStage(g); genOK(g); continue;
      }
      var k = ORDER[G.turn], r = G.rooms[k];
      if(r.down){ G.turn++; render(); continue; }
      if(k === G.player){
        setStage("act");
        pumping = false; busy = false; sel = -1;
        render();
        return;
      }
      G.acting = k;
      setStage("act");
      render();
      await wait(360); genOK(g);
      var before = takeSnap();
      step();
      G.acting = null;
      render();
      diffFloat(before, k);
      await afterFury(g, k);
      genOK(g);
      maybeTeammateLines(k, before);
      await wait(300); genOK(g);
      render();
    }
  }catch(err){
    if(err !== "stale") throw err;
  }finally{
    if(g === uiGen) busy = false;
  }
  if(g === uiGen && G && G.over){
    pumping = true;
    render();
    await wait(620);
    if(g === uiGen) showEnd();
  }
}

/* ============ 开局 / 规则 / 结算 ============ */

function startGame(season, seed){
  pickSeason = season || "spring";
  uiGen++;

  pumping = true;
  uiHp = null;
  hpAnim = false;
  uiRoom = null;
  uiStage = "reveal";

function calaRow(c, i){
  var bonus = i + 1 >= CFG.RAGE_ROUND ? 1 : 0;
  return '<tr><td>' + (i+1) + '</td><td><b>' + c.n + '</b></td><td>' + c.tx + '</td>' +
    '<td>' + c.d + (bonus ? ' (+' + bonus + ')' : '') + '</td></tr>';
}

function ruleVals(id){
  var c = CARDS[id];
  var mk = function(ex, dmg){
    var a = [];
    if(c.t === "atk") a.push("攻" + dmg + (c.pierce ? "破盾" : ""));
    if(ex.shieldAll) a.push("盾" + ex.shieldAll);
    if(ex.shieldSelf) a.push("自盾" + ex.shieldSelf);
    if(ex.healAll) a.push("血" + ex.healAll);
    if(ex.draw) a.push("抽" + ex.draw);
    if(ex.weaken) a.push("灾厄-" + ex.weaken);
    if(ex.revive) a.push("唤回");
    if(ex.selfLoss) a.push("自损" + ex.selfLoss);
    return a.join("·");
  };
  var base = mk(c.ex || {}, c.d || 0);
  var home = c.el ? mk(c.exh || c.ex || {}, c.dh || 0) : base;
  return { base: base, home: home };
}

function rulesHTML(){
  var rows = Object.keys(CARDS).map(function(id){
    var c = CARDS[id], v = ruleVals(id);
    var el = c.el ? SEASON_DEF[c.el].name : "通";
    var col = c.el ? SEASON_DEF[c.el].c : "#b6a06a";
    return '<tr><td><b>' + c.n + '</b><i style="color:' + col + '">' + el + '</i></td>' +
      '<td>' + v.base + '</td><td>' + (c.el ? v.home : "—") + '</td>' +
      '<td>' + c.tx + '</td></tr>';
  }).join("");

    var d = SEASON_DEF[k];
    return '<tr><td><b style="color:' + d.c + '">' + d.name + '</b><i>' + d.house + '</i></td>' +
      '<td>' + d.passive + '</td><td>' + d.pdesc + '</td></tr>';
  }).join("");
  var crows = CALAMITIES.map(calaRow).join("");
  return '<button class="xclose" id="r-x">×</button><h2>规则 · 灾厄年</h2>' +
    '<p class="kbd">四房合作，八回合内打灭年兽三盏灯。</p>' +

    '<h3>一、一回合怎么走</h3>' +
    '<ul>' +
      '<li>回合开始：四房各补 1 签（开局每人已有 2 签，手上限 6 签）。年兽同时<b>亮出本轮灾厄</b>——八支灾厄签的顺序固定，可以预判。</li>' +
      '<li>行动：固定顺序 <b>春 → 夏 → 秋 → 冬</b>，每房只能做一件事：<b>许愿</b>（用掉一支签）或 <b>馈赠</b>（把一支签插进左孔，传给左手下一房）。</li>' +
      '<li>结算：四房行动完毕后，年兽放出本轮灾厄，造成伤害、震落签。</li>' +
      '<li>回合结束：检查倒下与灯火，进入下一回合。</li>' +
    '</ul>' +

    '<h3>二、合击（同击加成）</h3>' +
    '<p>同一回合里，已经有别人攻击过年兽时，你的每一击伤害 <b>+20%</b>，最多 +60%（即 ×1.6）。' +
    '所以四房一起攻，比一人猛攻更划算；但都去攻就没人补防。</p>' +

    '<h3>三、四季能力</h3><div class="scrollx"><table class="tbl small">' +
    '<colgroup><col style="width:24%"><col style="width:15%"><col style="width:61%"></colgroup>' +
    '<tr><th>房</th><th>能力</th><th>效果</th></tr>' + srows + '</table></div>' +

    '<h3>四、本季加成</h3>' +
    '<p>每支签属于一个季节。在<b>本季</b>许愿时，伤害与效果翻倍（详见签表「本季」列）；' +
    '在别的季节许愿只吃基础值。<b>「爆竹」是唯一的例外：只在冬房有效</b>，拿在别的房就是废签，只能馈赠给冬。</p>' +

    '<h3>五、签表（14 种）</h3><div class="scrollx"><table class="tbl small">' +
    '<colgroup><col style="width:18%"><col style="width:28%"><col style="width:28%"><col style="width:26%"></colgroup>' +
    '<tr><th>签</th><th>基础</th><th>本季</th><th>说明</th></tr>' + rows + '</table></div>' +

    '<h3>六、年兽的八支灾厄签（顺序固定）</h3><div class="scrollx"><table class="tbl small">' +
    '<colgroup><col style="width:7%"><col style="width:17%"><col style="width:26%"><col style="width:50%"></colgroup>' +
    '<tr><th>#</th><th>灾厄</th><th>征兆</th><th>伤害</th></tr>' + crows + '</table></div>' +
    '<p class="note">第 5 回合起年兽<b>狂化</b>，所有灾厄 +1 伤；灯火 ≤24（只剩最后一盏灯）时<b>暴怒</b>，再 +1 伤。表中括号是狂化后额外增加的伤害。</p>' +

    '<h3>七、伤害与护盾</h3>' +
    '<ul>' +
      '<li>护盾先挡伤害，再扣气血；护盾最多叠到 6。</li>' +
      '<li>「春雷」破盾：直接扣气血，无视护盾（护盾不消耗）。</li>' +
      '<li>「蒲扇／霜降」折损灾厄：本轮每个被灾厄命中的房少受 N 伤，结算后清零。</li>' +
      '<li>「洪涝」会先冲散全队护盾再造成伤害——提前堆盾会被浪费。</li>' +
      '<li>气血归零即<b>倒下</b>：手中签全散、此后不能行动，队友的「压岁」可以唤回（气血 3）。</li>' +
      '<li>四房全部倒下立即败北。</li>' +
    '</ul>' +

    '<h3>八、胜负</h3>' +
    '<ul>' +
      '<li><b>胜</b>：八回合内把年兽 72 灯火打空（三盏灯全灭）。击杀当回合立即结算胜利。</li>' +
      '<li><b>败</b>：八回合打完仍有灯火；或四房全倒。</li>' +
    '</ul>' +

    '<h3>九、本作设定（原文未写清，按此实现）</h3>' +
    '<ul>' +
      '<li>三盏灯 → 72 灯火，每盏 24；伤害数值为本作拟定量。</li>' +
      '<li>四房气血 10、护盾上限 6、手牌上限 6；签共 14 种、牌堆 23 张循环发牌。</li>' +
      '<li>年兽八支灾厄签的顺序固定为 沙暴→地震→蝗灾→寒流→洪涝→毒瘴→山火→冰雹，与本回合一一对应。</li>' +
      '<li>允许「空过」：本回合不出签，保留手牌（原文要求必出一签，本作放宽以便预留）。</li>' +
      '<li>「馈赠」只能给左手下一房（还活着的那一间）。</li>' +
    '</ul>' +
    '<div class="btns" style="margin-top:12px"><button class="btn gold wide" id="r-close">知道了</button></div>';
}

function showRules(){
  $("rules-body").innerHTML = rulesHTML();
  $("ov-rules").classList.add("show");
  $("r-close").onclick = function(){ $("ov-rules").classList.remove("show"); };
  $("r-x").onclick = function(){ $("ov-rules").classList.remove("show"); };
  $("ov-rules").scrollTop = 0;
}

function showEnd(){
  if(!G || !G.over) return;
  finishCine();
  uiRoom = null;
  var win = G.over.win;
  var st = G.stats;
  var rounds = G.overAt || G.round;
  var quote = (function(){
    var alive = ORDER.filter(function(k){ return k !== G.player && !G.rooms[k].down; });
    var sp = alive[0] || (G.player === "spring" ? "summer" : "spring");
    var pool = LINES[sp] && LINES[sp][win ? "win" : "lose"];
    return pool ? pool[0] : "";
  })();
  var rows = ORDER.map(function(k){
    var d = SEASON_DEF[k], r = G.rooms[k];
    return '<div class="erow" style="--c:' + d.c + '"><b>' + d.name + '</b>' +
      '<span>' + (r.down ? "倒下" : r.hp + "/" + CFG.SEASON_HP) + '</span>' +
      '<i>' + (k === G.player ? "你" : "AI") + '</i></div>';
  }).join("");
  $("end-body").innerHTML =
    '<div class="hero ' + (win ? "win" : "lose") + '">' + (win ? "灯 灭 年 退" : "灾 厄 未 尽") + '</div>' +
    '<p class="kbd" style="text-align:center">' +
      (win ? "三盏灯全灭 · " + (4 - G.stats.downed) + " 房生还" : G.over.reason) + '</p>' +
    (quote ? '<p class="quote">“' + quote + '”</p>' : "") +
    '<div class="resbox six">' +
      '<div><span>用时</span><b>' + rounds + ' 回合</b></div>' +
      '<div><span>年兽剩余</span><b>' + G.beast.hp + ' 灯火</b></div>' +
      '<div><span>总输出</span><b>' + st.dealt + '</b></div>' +
      '<div><span>承伤</span><b>' + st.taken + '</b></div>' +
      '<div><span>最高单回合</span><b>' + st.maxRound + '</b></div>' +
      '<div><span>合击</span><b>' + st.comboHits + ' 次 / 最高 ×' + st.comboBest + '</b></div>' +
      '<div><span>倒下</span><b>' + st.downed + ' 房</b></div>' +
      '<div><span>出签</span><b>' + (st.wished + st.fed) + ' 次</b></div>' +
    '</div>' +
    '<div class="erows">' + rows + '</div>' +
    '<div class="btns" style="margin-top:8px">' +
      '<button class="btn" id="e-intro">换季节</button>' +
      '<button class="btn gold" id="e-again">再来一局</button>' +
    '</div>' +
    '<p class="note">你的季节：' + seasonName(G.player) + '房 · ' +
      (win ? "本次通关" : "本次失败") + '。换季节即换打法：春补签、夏直伤、秋连击、冬守藏。' +
      '本作为同人玩法复刻，模糊处按「本作设定」实现。</p>';
  $("ov-end").classList.add("show");
  document.body.classList.add("ended");
  $("e-again").onclick = function(){ startGame(G.player); };
  $("e-intro").onclick = function(){
    uiGen++;
    finishCine();
    busy = false;
    document.body.classList.remove("ended");
    $("ov-end").classList.remove("show");
    $("ov-intro").classList.add("show");
    renderIntro();
  };
}

/* ============ 启动 ============ */
(function init(){
  renderIntro();
  $("btn-rules").onclick = showRules;
  $("btn-pace").onclick = togglePace;
  $("btn-restart").onclick = function(){
    if(G && !G.over && G.round > 1){
      if(!window.confirm("重开本局？当前进度会丢失。")) return;
    }
    if(G) startGame(G.player); else renderIntro();
  };
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") $("ov-rules").classList.remove("show");
  });
})();

/* 供自测脚本调动（不构成外网依赖） */
window.__ZAIE = {
  cfg: CFG, cards: CARDS, calamities: CALAMITIES, seasons: SEASON_DEF,
  startUi: function(season, seed){ startGame(season, seed); },
  state: function(){ return G; },
  aiPick: function(){ return aiDecide(G.player); },
  effOf: function(id, k){ return effOf(id, k); },
  stage: function(){ return uiStage; },
  speakAt: function(k, tag){ speak(k, tag, true); },
  uiInfo: function(){
    return {
      stage: uiStage, pace: pace, busy: pumping,
      cine: document.querySelector("#cine").className,
      cineText: (document.querySelector("#cine-t") || {}).textContent
    };
  },
  newGame: function(season, seed){
    newGame(season || "spring", seed, { auto:true, strategy:window.__ZAIE.strategy || null });
    return this.snapshot();
  },
  setStrategy: function(fn){ window.__ZAIE.strategy = fn; },
  autoRun: function(){ autoRun(); return this.snapshot(); },
  runMany: function(n, season, strategy){
    var res = { win:0, lose:0, rounds:[], hp:[], err:[] };
    for(var i=0;i<n;i++){
      try{
        newGame(season || "spring", 1000 + i * 7919, { auto:true, strategy:strategy || null });
        autoRun();
        if(G.over && G.over.win) res.win++; else res.lose++;
        res.rounds.push(G.over ? G.overAt : 9);
        res.hp.push(G.beast.hp);
      }catch(err){ res.err.push(String(err && err.message)); }
    }
    return res;
  },
  snapshot: function(){
    if(!G) return null;
    return {
      round:G.round, turn:G.turn, over:G.over, beast:G.beast.hp, weaken:G.weaken,
      amp:ampMult(), phase:phaseName(),
      rooms: ORDER.map(function(k){
        var r = G.rooms[k];
        return { k:k, hp:r.hp, shield:r.shield, hand:r.hand.slice(), down:r.down };
      }),
      log:G.log.length, stats:G.stats
    };
  }
};
